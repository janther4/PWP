{% extends "admin/base.html" %}

{% block title %}Users | Webstore Admin{% endblock %}

{% block content %}
<section class="page-head">
    <h2>Users</h2>
    <a class="btn" href="{{ url_for('admin.create_user') }}">Add User</a>
</section>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Name</th>
            <th>Created</th>
        </tr>
    </thead>
    <tbody>
    {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.name }}</td>
            <td>{{ user.created_at }}</td>
        </tr>
    {% else %}
        <tr>
            <td colspan="4">No users yet.</td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
