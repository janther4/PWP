{% extends "admin/base.html" %}

{% if product %}
    {% set page_title = "Edit Product" %}
{% else %}
    {% set page_title = "Add Product" %}
{% endif %}

{% block title %}{{ page_title }} | Webstore Admin{% endblock %}

{% block content %}
<section class="page-head">
    <h2>{{ page_title }}</h2>
    <a class="btn btn-muted" href="{{ url_for('admin.products') }}">Back</a>
</section>

<form class="form-card" method="post">
    <label>SKU
        <input type="text" name="sku" required value="{{ product.sku if product else '' }}">
    </label>

    <label>Product name
        <input type="text" name="product_name" required value="{{ product.product_name if product else '' }}">
    </label>

    <label>Description
        <textarea name="description" rows="3">{{ product.description if product and product.description else '' }}</textarea>
    </label>

    <label>Price
        <input type="number" step="0.01" min="0" name="price" required value="{{ product.price if product else '' }}">
    </label>

    <label>Stock quantity
        <input type="number" min="0" name="stock_quantity" required value="{{ product.stock_quantity if product else 0 }}">
    </label>

    <button class="btn" type="submit">Save</button>
</form>
{% endblock %}
