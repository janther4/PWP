<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webstore Client</title>
  <link rel="stylesheet" href="/static/client/style.css">
</head>
<body>
  <header>
    <h1>Webstore Client</h1>
    <p>Manage users, products and orders with async API calls.</p>
  </header>

  <main class="container">
    <nav class="tabs">
      <button class="tab-btn active" data-tab="users">Users</button>
      <button class="tab-btn" data-tab="products">Products</button>
      <button class="tab-btn" data-tab="orders">Orders</button>
    </nav>

    <section class="panel tab-panel active" data-panel="users">
      <h2>Users</h2>
      <form id="user-form">
        <input name="email" type="email" placeholder="Email" required>
        <input name="name" type="text" placeholder="Name" required>
        <button type="submit">Add User</button>
      </form>
      <div id="users-list"></div>
    </section>

    <section class="panel tab-panel" data-panel="products">
      <h2>Products</h2>
      <form id="product-form">
        <input name="sku" type="text" placeholder="SKU" required>
        <input name="product_name" type="text" placeholder="Product name" required>
        <input name="price" type="number" step="0.01" min="0" placeholder="Price" required>
        <input name="stock_quantity" type="number" min="0" placeholder="Stock quantity" required>
        <input name="description" type="text" placeholder="Description">
        <button type="submit">Add Product</button>
      </form>
      <div id="products-list"></div>
    </section>

    <section class="panel tab-panel" data-panel="orders">
      <h2>Orders</h2>
      <form id="order-form">
        <input name="user_id" type="number" min="1" placeholder="User ID" required>
        <input name="product_id" type="number" min="1" placeholder="Product ID" required>
        <input name="quantity" type="number" min="1" placeholder="Quantity" required>
        <select name="status" required>
          <option value="placed">placed</option>
          <option value="paid">paid</option>
          <option value="cancelled">cancelled</option>
        </select>
        <button type="submit">Create Order</button>
      </form>
      <div id="orders-list"></div>
    </section>
  </main>

  <p id="status"></p>

  <script src="/static/client/app.js"></script>
</body>
</html>
